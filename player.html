<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timeline Player POC</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="src/timelinePlayer.css">
    <link rel="stylesheet" href="src/slideshowPlayer.css">
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="src/mapPlayer.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="timeline-title-editor">
          <div class="title-row">
            <div class="title-display">
              <span id="timeline-title-text">No timeline loaded</span>
            </div>
            <div class="header-actions" id="header-actions">
              <button class="icon-button attention" type="button" id="open-load-file" aria-label="Load timeline file" title="Load">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <path d="m7 10 5-5 5 5"></path>
                  <path d="M12 5v12"></path>
                </svg>
              </button>
              <input class="sr-only" id="load-file" type="file">
            </div>
          </div>
        </div>
        <nav class="nav-links" aria-label="App pages">
          <a class="button" href="index.html">Product</a>
          <a class="button" href="editor.html">Editor</a>
          <a class="button" href="player.html" data-nav="player" aria-current="page">Player</a>
        </nav>
      </header>

      <section class="player-workspace">
        <section class="panel player-panel">
          <p id="timeline-summary">Use the load button in the header or drop a timeline file anywhere on this page.</p>
          <div class="timeline" id="timeline"></div>
          <div class="status" id="status" role="status"></div>
        </section>
      </section>
    </main>

    <dialog class="modal" id="load-dialog">
      <div class="modal-panel">
        <header class="modal-header">
          <h2>Load timeline</h2>
          <button class="icon-button" type="button" id="close-load-dialog" aria-label="Close load dialog">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
          </button>
        </header>
        <div class="progress-track" aria-label="Load progress">
          <div class="progress-bar" id="load-progress-bar"></div>
        </div>
        <div class="load-log" id="load-log" role="status"></div>
      </div>
    </dialog>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script type="module" src="src/player.js"></script>
  </body>
</html>
